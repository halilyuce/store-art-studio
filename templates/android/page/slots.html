<!doctype html>
<html><head><meta charset="utf-8">
<!-- Google Play phone slots, 1080 x 1920. One URL per slot: slots.html?l=<store locale>&s=<slot>.
     Optional: &variant=<name> (an alternate version of a slot, written as <NN>-<name>.png; the
     sample's slot 1 has "straight"), &overflow=1 (the width test's negative check: makes line 1
     too wide on purpose).
     Optional surfaces (widgets, notification, wear, tablet) appear only when the config's
     "surfaces" lists them, so a screens-only app gets a complete set too.
     The market list is storeart.config.json, one level up (kit.js reads it); the copy is copy.js.
     Nothing here names a language. The page only places PNGs: app surfaces from ui/<market>/
     (written by the storeart module, by ROLE id), generated art from art/ (each with its
     provenance .txt). It never draws app UI. A missing PNG shows as a labelled box. -->
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<script src="copy.js"></script>
</head>
<body>
<div id="slot" class="slot"></div>
<script>
const q = new URLSearchParams(location.search);
const S = +(q.get('s') || 1);
const slot = document.getElementById('slot');

function el(tag, cls, css, html) { const e = document.createElement(tag); if (cls) e.className = cls;
  if (css) Object.assign(e.style, css); if (html != null) e.innerHTML = html; return e; }
function add(parent, e) { parent.appendChild(e); return e; }

loadMarket(q.get('l')).then(async ({ market: M, L, clock, date, fontsReady, has }) => {
  const variant = q.get('variant') || '';
  const RTL = !!M.rtl;
  const copy = (COPY[L] || {})[S];
  if (!copy) { document.title = `NO COPY ${L} slot ${S}`; document.body.dataset.ready = '1'; return; }
  // Right to left: dir on the slot mirrors margins, pills and tile order (kit.css). Renders are
  // never mirrored: they come out of the app already laid out for the market.
  if (RTL) slot.setAttribute('dir', 'rtl');
  const UI = id => `ui/${M.code}/${id}.png`;
  const ART = p => `art/${p}${/\.\w+$/.test(p) ? '' : '.png'}`;

  // A render, or a labelled placeholder until it exists. id may be "a|b|c": the first that loads.
  function ui(parent, id, css, cls = 'card', phH = 400) {
    const ids = id.split('|');
    const img = el('img', cls, css); let k = 0; img.src = UI(ids[0]);
    img.onerror = () => { k++; if (k < ids.length) { img.src = UI(ids[k]); return; }
      img.replaceWith(el('div', 'ph', { height: phH + 'px', ...css }, ids[0])); };
    return add(parent, img);
  }
  // Role ids: a widget falls back from its Material You dark render to plain dark to light.
  const W = id => id + '-dyn-dark|' + id + '-dark|' + id;
  // Per-market art by file name: art/<kind>/<market code>.<ext>, else art/<kind>/default.<ext>.
  // A market gets art that fits it (its own hero, its own avatars) without a code change.
  function marketArt(parent, kind, ext, css) {
    const img = add(parent, el('img', 'abs', css)); let tried = false;
    img.onerror = () => { if (!tried) { tried = true; img.src = ART(`${kind}/default.${ext}`); } else img.remove(); };
    img.src = ART(`${kind}/${M.code}.${ext}`);
    return img;
  }

  // Headline lines placed by baseline. Inter Tight's ascent at line-height 1 is about 0.84 em.
  function headline(lines, tile) {
    const h = add(slot, el('div', 'h'));
    const css = getComputedStyle(document.documentElement);
    const base1 = parseFloat(css.getPropertyValue('--h-base-1')), pitch = parseFloat(css.getPropertyValue('--h-pitch'));
    const size = parseFloat(css.getPropertyValue('--h-size'));
    lines.forEach((raw, i) => {
      if (i === 0 && q.get('overflow') === '1') raw += ' ' + 'W'.repeat(14);
      const line = add(h, el('div', 'line'));
      line.style.top = (base1 + i * pitch - 0.84 * size) + 'px';
      raw.split(/(\[.*?\])/).filter(Boolean).forEach(part => {
        const pill = part.startsWith('[');
        const host = pill ? add(line, el('span', 'pill')) : line;
        const text = pill ? part.slice(1, -1) : part;
        text.split(/(\{tile\})/).filter(Boolean).forEach((t, k) => {
          if (t === '{tile}') {
            const im = add(host, el('img', 'tile' + (k === 0 ? ' lead' : '')));
            im.onerror = () => im.replaceWith(el('span', 'tile ph', { position: 'relative', fontSize: '18px' }, 'tile'));
            im.src = ART('tiles/' + tile);
          } else add(host, el('span', null, null, t.replace(/ /g, '&nbsp;')));
        });
      });
    });
    return h;
  }
  function body(lines, top) { return add(slot, el('div', 'body', { top: top + 'px' }, lines.join('<br>'))); }

  // Status bar, measured once from a real emulator capture in SystemUI demo mode, 1280 px wide
  // (references/android-compose.md, "Status bar chrome"): clock left 86 px, centred at y 77, 42 px;
  // icons end 58 px from the right. Remeasure from your own capture, then freeze it. The bar is
  // not mirrored in RTL, as on a phone.
  function statusBar(parent, w, dark = true) {
    const k = w / 1280, c = dark ? '#F1F1F4' : '#1B1B1F';
    const bar = add(parent, el('div', null, { position: 'absolute', left: '0', top: '0', width: w + 'px', height: (154 * k) + 'px', zIndex: 4, direction: 'ltr' }));
    // Pixels use Google Sans here; Roboto is the closest face on Google Fonts. Match your capture.
    add(bar, el('div', null, { position: 'absolute', left: (86 * k) + 'px', top: (77 * k) + 'px', transform: 'translateY(-50%)',
      font: `400 ${42 * k}px 'Roboto', 'Inter', sans-serif`, color: c }, clock));
    const ic = add(bar, el('div', null, { position: 'absolute', right: (58 * k) + 'px', top: (77 * k) + 'px', transform: 'translateY(-50%)',
      display: 'flex', alignItems: 'center', gap: (14 * k) + 'px' }));
    ic.innerHTML = `
      <svg width="${44*k}" height="${34*k}" viewBox="0 0 24 18"><path fill="${c}" d="M12 17.6 0.4 5.6C3.5 2.6 7.6 1 12 1s8.5 1.6 11.6 4.6z"/></svg>
      <svg width="${36*k}" height="${34*k}" viewBox="0 0 20 18"><path fill="${c}" d="M19 1v16H3z"/></svg>
      <span style="display:inline-flex;align-items:center;height:${34*k}px;padding:0 ${8*k}px;border-radius:${10*k}px;background:${c};color:${dark ? '#121318' : '#fff'};font:500 ${26*k}px 'Roboto','Inter';letter-spacing:-0.02em">100</span>`;
    return bar;
  }

  // A phone at x,y, outer width Wd, outer height H, showing a full-screen render (412 x 915 dp,
  // 1236 px wide at 3x) below the status bar, or custom content through inner(screen, width).
  function phone(x, y, Wd, H, screenId, opts = {}) {
    const w = Wd - 32, k = w / 1280;
    const p = add(slot, el('div', 'phone', { left: x + 'px', top: y + 'px', width: Wd + 'px', height: H + 'px' }));
    const scr = add(p, el('div', 'screen'));
    add(scr, el('div', 'cam', { top: (52 * k) + 'px', width: (44 * k) + 'px', height: (44 * k) + 'px', marginLeft: (-22 * k) + 'px' }));
    if (screenId) ui(scr, screenId, { position: 'absolute', top: (154 * k) + 'px', left: '0px', width: '100%' }, 'ui', Math.round(w * 915 / 412));
    if (opts.inner) opts.inner(scr, w);
    statusBar(scr, w, opts.dark !== false);
    return p;
  }

  const decorate = [];
  const layouts = {
    // One headline, one body, one object: the real list screen in a phone. With a notification
    // surface, the real live card floats over its lower edge as a transparent cut-out. Variant
    // "straight": the card sits level, for a set that avoids tilted elements.
    1() {
      marketArt(slot, 'hero', 'jpg', { left: '0', top: '0', width: '1080px', height: '1920px', objectFit: 'cover', opacity: '.35' });
      headline(copy.h, copy.tile);
      body(copy.body, 520);
      phone(140, 700, 800, 1240, 'screen_list-dark|screen_list');
      if (has('notification')) {
        const tilt = variant === 'straight' ? 0 : (RTL ? 3 : -3);
        ui(slot, 'card_live-dark|card_live', { left: RTL ? '80px' : '300px', top: '1400px', width: '700px',
          filter: 'drop-shadow(0 30px 44px rgba(20,20,50,.38))', transform: `rotate(${tilt}deg)` }, 'card', 220);
      }
    },
    // The lock screen: the market's own date line and clock, the real widget and the live card,
    // each only if the app has it. A screens-only app gets a second screen here instead.
    // A decorative object sits beside the headline only where the headline leaves room for it.
    2() {
      headline(copy.h, copy.tile);
      body(copy.body, 520);
      if (!has('widgets') && !has('notification')) {
        phone(110, 700, 860, 1400, 'screen_detail-dark|screen_detail|screen_list-dark|screen_list');
      } else phone(110, 700, 860, 1400, null, { inner: (scr, w) => {
        scr.style.background = 'linear-gradient(180deg, #2B2C6E, #121330)';
        add(scr, el('div', null, { position: 'absolute', top: (190 * w / 1280) + 'px', width: '100%', textAlign: 'center', color: '#fff',
          font: "400 38px 'Roboto', 'Inter', var(--script-font)" }, date));
        add(scr, el('div', null, { position: 'absolute', top: (260 * w / 1280) + 'px', width: '100%', textAlign: 'center', color: '#fff',
          font: "400 220px/1 'Roboto', 'Inter'", letterSpacing: '-0.02em', direction: 'ltr' }, clock));
        // Stacked in a column, not at fixed tops: a render's height depends on the app and the
        // script (Arabic lines are taller), so a fixed top lets the card cover the widget.
        const stack = add(scr, el('div', null, { position: 'absolute', left: '40px', top: '450px', width: (w - 80) + 'px',
          display: 'flex', flexDirection: 'column', gap: '30px' }));
        if (has('widgets')) ui(stack, W('widget_list_big'), { position: 'relative', width: '100%', borderRadius: '40px' }, 'flow', 520);
        if (has('notification')) ui(stack, 'card_live-dark|card_live', { position: 'relative', width: '100%' }, 'flow', 180);
      } });
      decorate.push(() => {
        // Measure, never hard-code: a translation is usually longer than the source.
        const room = [...document.querySelectorAll('.h .line')].every(l => {
          const b = l.getBoundingClientRect(); return (RTL ? 1080 - b.left : b.right) < 760; });
        if (!room) return;
        const x = (RTL ? 70 : 800) + 'px';
        const o = add(slot, el('img', 'abs', { left: x, top: '70px', width: '220px', height: '220px', objectFit: 'contain',
          filter: 'drop-shadow(0 22px 26px rgba(40,30,60,.28))' }));
        o.onerror = () => o.replaceWith(el('div', 'ph', { left: x, top: '70px', width: '220px', height: '220px' }, 'object'));
        o.src = ART('objects/one');
      });
    },
  };
  if (!layouts[S]) { document.title = `NO LAYOUT slot ${S}`; document.body.dataset.ready = '1'; return; }
  layouts[S]();

  await fontsReady;
  decorate.forEach(f => f());
  // Width test: every headline line must end at x <= 1015 (the iOS 1240 / 1320 limit, scaled).
  // In RTL a line grows leftwards, so measure from its LEFT edge (1080 - left), or an RTL
  // overflow passes unseen. Never shrink the type: rewrite the line. tools/widthtest.sh reads the title.
  const over = [...document.querySelectorAll('.h .line')].map((l, i) => {
    const b = l.getBoundingClientRect(); return [i + 1, Math.round(RTL ? 1080 - b.left : b.right)];
  }).filter(([, r]) => r > 1015);
  document.title = over.length ? 'OVERFLOW ' + over.map(([i, r]) => `line${i}=${r}px`).join(' ') : 'WIDTH OK';
  over.forEach(([i]) => { document.querySelectorAll('.h .line')[i - 1].style.outline = '6px solid red'; });
  document.body.dataset.ready = '1';
}).catch(e => { document.title = 'ERROR ' + e.message; document.body.dataset.ready = '1'; });
</script>
</body></html>
